[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sledenje-objektom-2"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12"
description = "Object tracker using a camera as its source and tracks using Aruco tags"
authors = [
    { name = "Jakob Maležič", email = "jakob.malezic@gmail.com" }
]
maintainers = [
    { name = "Žiga Slatnar Štagar", email = "contact@privatech.dev" }
]
license = { text = "unlicense" }

dependencies = [
    "numpy==2.5.3",
    "shapely==2.1.2",
    "pyyaml==6.0.3",
]

# Exactly one OpenCV build must be installed, pick it with an extra
[project.optional-dependencies]
# OpenCV with GUI support, needed for --setup and the debug preview window
gui = ["opencv-contrib-python==4.14.0.94"]
# OpenCV without GUI support, for servers and containers
headless = ["opencv-contrib-python-headless==4.14.0.94"]

# Groups used when developing this repo, so `uv sync` installs the GUI build by default
[dependency-groups]
gui = ["sledenje-objektom-2[gui]"]
headless = ["sledenje-objektom-2[headless]"]

[project.urls]
Repository = "https://github.com/RoboLiga/sledenje-objektom-2"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]

[tool.uv]
default-groups = ["gui"]
conflicts = [
    [{ extra = "gui" }, { extra = "headless" }],
    [{ group = "gui" }, { group = "headless" }],
]
